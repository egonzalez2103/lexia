services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: juridico
      MYSQL_USER: juridico
      MYSQL_PASSWORD: juridico
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - juridico_mysql:/var/lib/mysql

volumes:
  juridico_mysql:
