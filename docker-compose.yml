services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lexia
      MYSQL_USER: lexia
      MYSQL_PASSWORD: lexia
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - lexia_mysql:/var/lib/mysql

volumes:
  lexia_mysql:
